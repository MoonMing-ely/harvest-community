name: build-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: harvest-linux-x86_64
            archive: harvest-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: harvest-windows-x86_64.exe
            archive: harvest-windows-x86_64.zip
          - os: macos-15-intel
            artifact: harvest-macos-x86_64
            archive: harvest-macos-x86_64.tar.gz
          - os: macos-15
            artifact: harvest-macos-arm64
            archive: harvest-macos-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - run: python -m pytest
        env:
          PYTHONPATH: src
      - run: pyinstaller --clean --noconfirm harvest.spec
      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mv dist/harvest "dist/${{ matrix.artifact }}"
          chmod 755 "dist/${{ matrix.artifact }}"
      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item dist/harvest.exe "dist/${{ matrix.artifact }}"
      - name: Package standalone archive (Unix)
        if: runner.os != 'Windows'
        run: tar -C dist -czf "dist/${{ matrix.archive }}" "${{ matrix.artifact }}"
      - name: Package standalone archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.artifact }}" -DestinationPath "dist/${{ matrix.archive }}"
      - name: Write archive SHA-256 (Unix)
        if: runner.os != 'Windows'
        working-directory: dist
        run: shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - name: Write archive SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: |
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Set-Content "${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
